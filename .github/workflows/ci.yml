name: CI

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'
      - name: Test packages
        run: pnpm exec turbo run test --filter='./packages/*'

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,website/dist,website/.astro,packages/*/dist,examples/*/dist
      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Fail on HIGH+
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,website/dist,website/.astro,packages/*/dist,examples/*/dist

  grype:
    name: Grype scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Grype scan
        uses: anchore/scan-action@v7.4.2
        id: grype-scan
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype
