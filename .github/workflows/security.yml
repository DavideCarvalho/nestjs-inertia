name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — catch newly-published CVEs against unchanged code
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # required for SARIF upload to Code Scanning

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,website/dist,website/.astro,packages/*/dist,examples/*/dist
      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Fail on HIGH+ severity (table output)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,website/dist,website/.astro,packages/*/dist,examples/*/dist

  grype:
    name: Grype dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scan the workspace root but cut off at critical to avoid noise from
      # Go-stdlib CVEs that grype detects inside CI runner toolchain binaries
      # (not part of our published surface). Real findings against our npm
      # tarballs surface here.
      - name: Grype scan
        uses: anchore/scan-action@v6
        id: grype-scan
        with:
          path: .
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: sarif
      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype
